name: Check theme

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install style and Ucode build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev libmd-dev
          npm install --global less@4.1.3 clean-css-cli@5.6.3

      - name: Build Ucode for template checks
        run: |
          mkdir -p "$RUNNER_TEMP/argon-ucode"
          git -C "$RUNNER_TEMP/argon-ucode" init
          git -C "$RUNNER_TEMP/argon-ucode" remote add origin https://github.com/jow-/ucode.git
          git -C "$RUNNER_TEMP/argon-ucode" fetch --depth 1 origin bec38612f0430861841aa8be4da10a6af4665be7
          git -C "$RUNNER_TEMP/argon-ucode" checkout FETCH_HEAD
          cmake -S "$RUNNER_TEMP/argon-ucode" -B "$RUNNER_TEMP/argon-ucode/build" \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DFFI_SUPPORT=OFF
          cmake --build "$RUNNER_TEMP/argon-ucode/build" --target ucode -j2

      - name: Check templates, scripts, styles, and behavior
        run: |
          UCODE_BIN="$RUNNER_TEMP/argon-ucode/build/ucode" sh .github/scripts/check_theme.sh
